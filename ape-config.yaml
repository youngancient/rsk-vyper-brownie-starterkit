# Ape Configuration for Rootstock Networks
# WARNING: Public nodes (public-node.rsk.co) are strictly recommended for light 
# development only and enforce severe rate limits (e.g., 60 requests/minute).
# For production scale, replace with dedicated Infura / Alchemy / Quicknode endpoints.

  # - OpenZeppelin/openzeppelin-contracts@4.0.0

vyper:
  version: "0.4.3"

node:
  rootstock:
    testnet:
      uri: https://public-node.testnet.rsk.co
    mainnet:
      uri: https://public-node.rsk.co

etherscan:
  rootstock:
    mainnet:
      uri: https://rootstock.blockscout.com/api
    testnet:
      uri: https://rootstock-testnet.blockscout.com/api

# Gas settings
gas_limit: auto
gas_price: auto

# Project settings
project_structure:
  contracts: [contracts, tests]
  tests: tests
  scripts: scripts


