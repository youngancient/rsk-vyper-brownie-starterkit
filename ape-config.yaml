# Ape Configuration for Rootstock Networks
# WARNING: Public nodes (public-node.rsk.co) are strictly recommended for light 
# development only and enforce severe rate limits (e.g., 60 requests/minute).
# For production scale, replace with dedicated Infura / Alchemy / Quicknode endpoints.

  # - OpenZeppelin/openzeppelin-contracts@4.0.0

vyper:
  version: "0.4.3"

networks:
  # Rootstock Testnet
  rootstock-testnet:
    host: ${RSK_TESTNET_RPC:-https://public-node.testnet.rsk.co}
    chainid: 31
    explorer: https://rootstock-testnet.blockscout.com/api
    
  # Rootstock Mainnet
  rootstock-mainnet:
    host: ${RSK_MAINNET_RPC:-https://public-node.rsk.co}
    chainid: 30
    explorer: https://rootstock.blockscout.com/api

# Wallet settings
wallets:
  from_key: ${PRIVATE_KEY}

# Gas settings
gas_limit: auto
gas_price: auto

# Project settings
project_structure:
  contracts: contracts
  tests: tests
  scripts: scripts

# Report settings
report:
  exclude_contracts:
    - SafeMath
    - TestContract

